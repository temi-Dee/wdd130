<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Ayodele Daniel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Adventures</title>
    <meta name="description"
        content="Get in touch with Whitewater Rafting Adventures. Contact us for inquiries, bookings, and more information about our exciting rafting experiences.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <div id="content">
        <header>
            <img src="images/logo.png" alt="Day Out Logo" class="logo">
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html" class="active">Contact Us</a>
            </nav>
        </header>

        <main>
            <section class="company-info">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kaduna,Nigeria</p>
                <p>+234 903 906 256 1</p>
                <p>ayodeledanielQgmail.com</p>
            </section>

            <div class="contact-container">
                <section class="map-section">
                    <h2>LOCATION</h2>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3036.5897659836503!2d-105.2705!3d40.3774!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876bdb0d0d0d0d0d%3A0x0!2sCanyon%20City%2C%20CO!5e0!3m2!1sen!2sus!4v1234567890"
                        width="600" height="500" allowfullscreen="" title="White Water Rafting Location Map"></iframe>
                </section>

                <section class="contact-form">
                    <h2>CONTACT FORM</h2>
                    <form>
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full Name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Gmail" required>

                        <fieldset>
                            <legend>Message Purpose</legend>
                            <label>
                                <input type="radio" name="purpose" value="inquiry" checked> General Inquiry
                            </label>
                            <label>
                                <input type="radio" name="purpose" value="reservation"> Reservation Question
                            </label>
                            <label>
                                <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                            </label>
                        </fieldset>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                        <label>
                            <input type="checkbox" name="newsletter" checked>
                            Please Subscribe me to the monthly newsletter
                        </label>

                        <button type="submit">Get in Touch!</button>
                    </form>
                </section>
            </div>

            <section class="employee-section">
                <h2>We Are Here to Serve You</h2>
                <div class="employee-grid">
                    <figure>
                        <img src="images/employee1.jpg" alt="Employee 1">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee2.jpg" alt="Employee 2">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee3.jpg" alt="Employee 3">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2025 Whitewater Rafting Adventures. Ayodele Daniel</p>
            <nav class="socialmedia">
                <a href="#"><img src="images/facebook.svg" alt="Facebook"></a>
                <a href="#"><img src="images/linkedin.svg" alt="LinkedIn"></a>
                <a href="#"><img src="images/instagram-square.svg" alt="Instagram"></a>
            </nav>
        </footer>

    </div>
</body>

</html>
